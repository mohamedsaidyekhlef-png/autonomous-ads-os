services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads_dev_password
      POSTGRES_DB: ads_os
    ports:
      - "5432:5432"
    volumes:
      - ads_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ads_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ads_postgres_data:
  ads_redis_data:
